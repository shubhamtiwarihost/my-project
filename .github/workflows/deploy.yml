name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        env:
          VITE_API_BASE: https://shubhamprofile.info/api
        run: npx vite build --base=/

      - name: Prepare deploy package
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -e
          mkdir -p deploy
          # Frontend build
          cp -R dist/. deploy/
          # Admin CMS + Public API
          cp -R admin deploy/admin
          cp -R api deploy/api

          # Keep uploads folder present but empty in package (real uploads stay on server)
          mkdir -p deploy/admin/storage/uploads/images
          mkdir -p deploy/admin/storage/uploads/documents
          mkdir -p deploy/admin/storage/uploads/backups

          if [ -z "$DB_PASSWORD" ]; then
            echo "Missing GitHub secret: DB_PASSWORD"
            exit 1
          fi

          # Inject DB password into admin config (do not commit real password)
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path("deploy/admin/config/config.php")
          text = path.read_text()
          pwd = os.environ["DB_PASSWORD"].replace("\\", "\\\\").replace("'", "\\'")
          if "__DB_PASSWORD__" not in text:
              raise SystemExit("Placeholder __DB_PASSWORD__ not found in config.php")
          path.write_text(text.replace("__DB_PASSWORD__", pwd))
          print("DB password injected into admin config")
          PY

      - name: Normalize FTP target dir
        env:
          RAW_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -e
          # Hostinger FTP logins usually start already inside public_html.
          # Using "public_html/" would upload to public_html/public_html/ and miss the live site.
          dir="${RAW_DIR:-./}"
          trimmed="${dir#/}"
          trimmed="${trimmed%/}"
          if [ -z "$trimmed" ] || [ "$trimmed" = "." ] || [ "$trimmed" = "public_html" ]; then
            NORMALIZED="./"
          else
            NORMALIZED="${trimmed}/"
          fi
          echo "FTP_SERVER_DIR=$NORMALIZED" >> "$GITHUB_ENV"
          echo "Using server-dir='$NORMALIZED' (from secret length=${#RAW_DIR})"

      - name: Deploy to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          # false = do not wipe existing media uploads on every deploy
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            admin/storage/uploads/images/**
            admin/storage/uploads/documents/**
            admin/storage/uploads/backups/**
            **/.DS_Store
            public_html/**
            public_html/**/**

      - name: Verify live site assets
        run: |
          set -e
          html="$(curl -fsSL "https://shubhamprofile.info/")"
          if echo "$html" | grep -q '/techbio/assets/'; then
            echo "Live index.html still points at /techbio/assets/ — FTP target is wrong."
            exit 1
          fi
          if ! echo "$html" | grep -q '/assets/index-'; then
            echo "Live index.html missing /assets/ bundle — deploy did not update the site root."
            exit 1
          fi
          echo "Live site index references /assets/ (ok)"
